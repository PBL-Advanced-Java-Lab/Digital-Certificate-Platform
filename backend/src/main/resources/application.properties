spring.application.name=digital-certificate-platform

server.port=${PORT:8080}

# Explicit PostgreSQL Dialect so Hibernate never fails on dialect detection
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Database (Hostable & Local Fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/digital_certificate_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:pikachu}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Security & JWT
jwt.secret=${JWT_SECRET:CertiGuardSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (Frontend Integration & Hosting Ready)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}